# HAProxy TCP load-balancer for the Cloudflare WARP pool.
# Spreads SOCKS5 connections across warp / warp2 / warp3 (each = its own egress IP),
# exposed as a single endpoint warp-lb:1080. Add more `server` lines to scale.
global
    maxconn 8192
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    retries 3

frontend socks_in
    bind *:1080
    default_backend warp_pool

backend warp_pool
    balance leastconn
    server warp1 warp:1080  check
    server warp2 warp2:1080 check
    server warp3 warp3:1080 check
