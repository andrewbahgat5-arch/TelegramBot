# Local development stack — MASTER_PLAN Task 0.8.
# Infrastructure only (postgres-15, redis-7, pgbouncer, uptime-kuma).
# App containers (bot/worker/api) are added in Sprint 12 deployment work.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml down
#
# Values here are LOCAL DEV ONLY. Production secrets come from the orchestrator.

name: telegram-bot-dev

services:
  postgres:
    image: postgres:15
    container_name: tgbot_postgres
    environment:
      POSTGRES_DB: telegram_bot
      POSTGRES_USER: telegram_bot
      POSTGRES_PASSWORD: change-me-local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_bot -d telegram_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: tgbot_redis
    # Persistence on (AOF + RDB) per MASTER_PLAN 6.1.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tgbot_pgbouncer
    # Transaction pooling (MASTER_PLAN D-020).
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: telegram_bot
      DB_PASSWORD: change-me-local
      DB_NAME: telegram_bot
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: tgbot_uptime_kuma
    # Probes /v1/health and /v1/ready once the API process is deployed.
    ports:
      - "3001:3001"
    volumes:
      - kuma:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kuma:
