; PgBouncer reference config — MASTER_PLAN D-020.
; The docker-compose pgbouncer service is configured via environment variables;
; this file documents the equivalent settings for a non-container deployment.

[databases]
telegram_bot = host=postgres port=5432 dbname=telegram_bot

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a server connection is returned to the pool at the end of
; each transaction. Required because the app runs three processes (bot, worker, api)
; and PostgreSQL default max_connections=100 is otherwise at risk.
pool_mode = transaction

max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 10
reserve_pool_timeout = 5

; SQLAlchemy uses prepared statements; transaction pooling requires they be disabled
; at the driver level (asyncpg statement_cache_size=0). Documented for Sprint 2.
server_reset_query =
ignore_startup_parameters = extra_float_digits
