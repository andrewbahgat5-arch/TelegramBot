# yt-dlp runtime config — auto-loaded as System config (/etc/yt-dlp.conf).
# YouTube from a datacenter IP is solved WITHOUT a paid proxy by:
#   1) --proxy socks5://warp-lb:1080  -> Cloudflare WARP clean egress IP (no bot-block)
#   2) bgutil PO Token provider     -> authorizes GVS media URLs (no 403)
#   3) --remote-components ejs      -> Deno solves the JS signature/n challenge
# Cookies are NOT required (kept optional via the wrapper for age-restricted videos).
--proxy socks5://warp-lb:1080
--extractor-args youtubepot-bgutilhttp:base_url=http://bgutil-pot:4416
--remote-components ejs:github
--retries 5
--socket-timeout 30
