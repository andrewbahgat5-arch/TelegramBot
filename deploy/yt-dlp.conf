# yt-dlp runtime config — auto-loaded as System config (/etc/yt-dlp.conf).
# NOTE: the egress proxy is NOT set here anymore — the app chooses it PER PLATFORM
# (infrastructure/downloader/routing.py): residential proxy / WARP for blocked platforms
# (YouTube), DIRECT for the rest. YouTube from a proxied clean IP is further helped by:
#   1) bgutil PO Token provider  -> authorizes GVS media URLs (no 403)
#   2) --remote-components ejs   -> Deno solves the JS signature/n challenge
# Cookies are optional (mounted via the wrapper; needed for logged-in YouTube).
--extractor-args youtubepot-bgutilhttp:base_url=http://bgutil-pot:4416
# Skip the extra "configs" fetch during extraction — shaves a round-trip off metadata
# without dropping any formats (verified). Speeds up the chooser, esp. over a slow link.
--extractor-args youtube:player_skip=configs
--remote-components ejs:github
--retries 10
--socket-timeout 30
# Large 1080p+ streams through the WARP proxy can have a fragment 403/reset mid-transfer
# (GVS URL/PO-token expiry on a long download). Retry the fragment and the finalise/rename
# in-process before failing the whole download, so big files complete on the first job.
--fragment-retries 10
--file-access-retries 5
--retry-sleep 2
