# Alembic configuration (MASTER_PLAN Task 2.1).
# The database URL is built dynamically from core/config.py in migrations/env.py;
# it is intentionally NOT stored here (no secrets in the repo).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Timestamp-prefixed revision filenames (Section 19.2): {YYYYMMDDHHMM}_{slug}.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(slug)s
